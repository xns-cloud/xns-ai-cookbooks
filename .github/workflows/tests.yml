name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agentic-doc-parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Docling is stubbed by the tests, so its (heavy) dependency tree is
      # deliberately not installed here.
      - name: Install test dependencies
        run: pip install langchain-xns openai pydantic

      - name: Offline tests
        working-directory: agentic-doc-parsing
        run: python test_pipeline.py

  agent-workspace-timings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The timing harness is stdlib-only on purpose, so this job installs
      # nothing. It does not touch a gateway; it checks the formatting and
      # bookkeeping the printed table depends on.
      - name: Offline timing tests
        working-directory: agent-workspace
        run: python test_timings.py

  persistent-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The offline tests never reach Qdrant or a gateway, but importing
      # index.py pulls in its client libraries, so they are installed.
      # The OpenAI extras are not -- that path is not exercised here.
      - name: Install test dependencies
        run: pip install langchain-xns langchain-text-splitters "qdrant-client>=1.19,<2" requests

      - name: Offline tests
        working-directory: persistent-index
        run: python test_index.py
