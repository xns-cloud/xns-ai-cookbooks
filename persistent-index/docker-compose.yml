# Qdrant, one container. Nothing else runs locally -- the vectors live
# here, and the snapshot that makes them survive this container lives in
# your XNS bucket.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # REST -- the client and the snapshot upload both use this
      - "6334:6334"   # gRPC, unused by this recipe, exposed for your own clients
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # Qdrant's own readiness endpoint. `docker compose up --wait` blocks
      # on this, so the script never races the container's first second.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  # Named, so `docker compose down` keeps the index and `down -v` is the
  # deliberate way to throw it away. The recipe's point is that losing
  # this volume is survivable either way.
  qdrant-storage:
